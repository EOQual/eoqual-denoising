# Documentation de poetry: https://python-poetry.org/docs/pyproject/

[tool.poetry]
name = "eoqual-denoising"
version = "0.1.0"
description = "Collection of Earth observation image denoising methods"
authors = ["Olivier Amram <olivier.amram@free.fr>"]
maintainers = [
    "Olivier Amram <olivier.amram@free.fr>"
]
repository = "https://github.com/EOQual/eoqual-denoising.git"
readme = "README.md"
license = "MIT"
keywords = ["denoising", "remote-sensing", "image", "earth-observation"]
packages = [{include = "eoqual/denoising", from = "src"}]
include = ["src/eoqual/denoising/optimization/spaces/*.jsonc"]
exclude = [
    "**/__pycache__",
    "**/.DS_Store",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = "*"
# scipy : loi de Poisson de l'inverse exacte de la GAT (vst.py).
scipy = "*"
scikit-image = "*"
opencv-python = "*"
pywavelets = "*"
matplotlib = "^3.5.0"
rich = "*"
# nl_bayes (exécutable IPOL, GPL-3.0+) et nl_ridge (clone Inria,
# AGPL-3.0) ne sont PAS des dépendances pip : composants externes fournis
# par l'utilisateur, appelés sans être embarqués — voir
# THIRD_PARTY_LICENSES.md §2.3.

# --- Extra "deep" (DRUNet via deepinv ; aussi requis par nl_ridge) ---
# deepinv et ses poids DRUNet : BSD-3-Clause. Non installé par défaut :
# dépendance lourde (PyTorch).
torch = {version = ">=2.2", optional = true}
deepinv = {version = "*", optional = true}
einops = {version = "*", optional = true}

# --- Extra "ptwt" (wavelet_dict, avec l'extra "deep") ---
# PyTorch Wavelet Toolbox : EUPL-1.2 (copyleft) — lire
# THIRD_PARTY_LICENSES.md §2.2 avant d'installer cet extra.
ptwt = {version = "*", optional = true}

# --- Extra "bm3d" (Tampere University) ---
# Licence NON COMMERCIALE — lire THIRD_PARTY_LICENSES.md §2.2 avant
# d'installer cet extra.
bm3d = {version = "*", optional = true}

# --- Extra "optim" (optimisation bayésienne des paramètres) ---
# scikit-optimize : BSD-3-Clause. Dépôt d'origine archivé (2024) ; les
# versions 0.10.x sont publiées par une fourche (holgern/scikit-optimize).
scikit-optimize = {version = ">=0.10", optional = true}

[tool.poetry.extras]
optim = ["scikit-optimize"]
deep = ["torch", "deepinv", "einops"]
ptwt = ["ptwt"]
bm3d = ["bm3d"]

[tool.poetry.group.docs.dependencies]
sphinx = "*"
sphinx-rtd-theme = "*"
sphinx-autoapi = "*"

[tool.poetry.group.dev.dependencies]
poetry = "^2.1.1"
ipython = "^8.8.0"
black = "^23.3.0"
coverage = "^6.5.0"
pylint = "*"
pytest = "<9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
